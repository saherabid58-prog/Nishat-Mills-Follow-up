<script>
(function(){'use strict';
/* ===== 1. CONFIGURATION ===== */
const APP='textile-order-coordination',KEY='tocs_v1',RECOVERY='tocs_v1_recovery',VER=1;
const DUE_SOON=3,RISK_DAYS=7; // "due soon" = within 3 days; "at risk" window = 7 days

sample:['Not Requested','Requested','In Preparation','Sent to Client','Revision Requested','Resubmitted','Approved','Rejected'],
approval:['Not Required','Pending','Approved','Changes Requested','Rejected'],

quality:['Not Started','Pending Clearance','Cleared','Rework Required'],

const OF=[['id','Order ID','text','',1],['client','Client name','text','',1],['product','Product / fabric description','text'],['qty','Quantity (metres)','number'],
['created','Order creation date','date'],['shipDate','Deadline (required shipment date)','date'],['status','Overall order status','select',L.status,1],['pendingTask','Pending task','text'],
['sample','Sample status','select',L.sample,1],['approval','Client approval status','select',L.approval,1],['production','Production status','select',L.production,1],
['quality','Quality status','select',L.quality,1],['shipment','Shipment status','select',L.shipment,1],['owner','Responsible department','select',L.dept,1],
['priority','Priority','select',L.priority,1],['approvalDeadline','Client approval deadline','date'],['nextFollowUp','Next follow-up date','date'],
['lastFollowUp','Last follow-up date','date'],['nextAction','Next action','text'],['holdReason','Hold reason (required if on hold)','text'],['notes','Latest issue / notes','textarea']];
const SF=[['sampleReq','Sample request date','date'],['sampleDesc','Sample / revision description','text'],['sample','Sample status','select',L.sample,1],
['approval','Client approval status','select',L.approval,1],['sentDate','Date sent to client','date'],['approvalDeadline','Client approval deadline','date'],
['feedback','Client feedback','textarea'],['requestedChanges','Requested changes / revision reason','textarea'],['revisedDate','Revised sample date','date'],
['approvalDate','Approval date','date'],['nextFollowUp','Next follow-up date','date'],['nextAction','Next action','text']];
const LBL={};[...OF,...SF].forEach(f=>LBL[f[0]]=f[1]);
const TRACK=['status','sample','approval','production','quality','shipment','priority','owner','shipDate'];
const BLANK={id:'',client:'',product:'',qty:0,created:'',shipDate:'',status:'New',sample:'Not Requested',approval:'Not Required',production:'Not Started',quality:'Not Started',shipment:'Not Scheduled',owner:L.dept[0],priority:'Medium',notes:'',pendingTask:'',nextAction:'',nextFollowUp:'',lastFollowUp:'',holdReason:'',sampleReq:'',sampleDesc:'',sentDate:'',approvalDeadline:'',feedback:'',requestedChanges:'',revisedDate:'',approvalDate:''};
const CFGD={highShipDays:3,medShipDays:7,followWarnDays:1,pendingDays:7}; // risk rules (editable in Help & Data)
const TB={id:'',orderId:'',dept:L.dept[0],desc:'',person:'',created:'',due:'',priority:'Medium',status:'Open',nextAction:'',latestUpdate:''};
const DATEKEYS=['created','shipDate','nextFollowUp','lastFollowUp','approvalDeadline','sampleReq','sentDate','revisedDate','approvalDate'];

/* ===== 4. DATE AND BUSINESS-RULE UTILITIES (placed early: used by seed data) ===== */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}; // local date, no timezone shift
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&fmt(parse(s))===s;
const show=s=>s?parse(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const dayTxt=s=>{const d=diff(s,today());return d<0?(-d)+' day(s) overdue':d===0?'today':'in '+d+' day(s)'};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const shipped=o=>['Shipped','Delivered'].includes(o.shipment);
const isOpen=o=>!['Completed','Cancelled'].includes(o.status)&&o.shipment!=='Delivered'; // "active"
function flags(o){
 const f={active:isOpen(o),awaiting:false,revision:false,overdue:false,due:false,late:false,risk:false,reasons:[]};
 if(!f.active)return f;const t=today(),R=f.reasons;
 if(o.approval==='Pending'){f.awaiting=true;
  if(o.approvalDeadline&&o.approvalDeadline<t){f.overdue=true;R.push('Client approval overdue by '+diff(t,o.approvalDeadline)+' day(s) (deadline '+show(o.approvalDeadline)+'). Follow up with the client.')}}
 if(o.sample==='Revision Requested'||o.approval==='Changes Requested'){f.revision=true;R.push('Sample revision needed'+(o.requestedChanges?': '+o.requestedChanges:'. Record the requested changes.'))}
 if(o.nextFollowUp&&o.nextFollowUp<t){f.overdue=true;R.push('Follow-up was due '+show(o.nextFollowUp)+'. Next action: '+(o.nextAction||'not set')+'.')}
 if(o.status==='On Hold'||o.shipment==='On Hold')R.push('On hold: '+(o.holdReason||'no reason recorded')+'.');
 if(!shipped(o)&&o.shipDate){const d=diff(o.shipDate,t);
  if(d<0){f.late=f.risk=true;R.push('Shipment delayed: required date '+show(o.shipDate)+' has passed and the order is not marked Shipped.')}
  else{if(d<=DUE_SOON)f.due=true;
   if(d<=RISK_DAYS){const w=[];if(o.quality!=='Cleared')w.push('quality status is "'+o.quality+'"');
    if(!['Approved','Not Required'].includes(o.approval))w.push('client approval is "'+o.approval+'"');if(o.shipment==='On Hold')w.push('shipment is on hold');
    if(w.length){f.risk=true;R.push('Shipment at risk: due '+dayTxt(o.shipDate)+' but '+w.join(' and ')+'.')}}}}
 return f}
const M={active:['Active orders',f=>f.active,'Orders that are not Completed, Cancelled or Delivered.'],
awaiting:['Awaiting client approval',f=>f.awaiting,'Active orders whose client approval is Pending.'],
revision:['Sample revisions needed',f=>f.revision,'Active orders with sample status Revision Requested or approval Changes Requested.'],
overdue:['Overdue actions',f=>f.overdue,'Active orders with a pending approval past its deadline, or a follow-up date before today.'],
due:['Shipments due soon',f=>f.due,'Active, unshipped orders with a required shipment date in the next 3 days (including today).'],
risk:['Shipment / quality risks',f=>f.risk,'Active, unshipped orders past their shipment date, or due within 7 days with quality clearance or client approval incomplete, or on hold.']};
const guard=v=>['Ready for Shipment','Shipped','Delivered'].includes(v.shipment)&&v.quality!=='Cleared'?
 'Cannot set shipment to "'+v.shipment+'" because quality status is "'+v.quality+'". Confirm clearance with the Quality team, set Quality status to "Cleared", then save again.':'';

/* ---- Risk engine: High / Medium / Low calculated from status, pending items and dates (rules in S.config) ---- */
const RK={High:3,Medium:2,Low:1,Closed:0};
function risk(o){const f=flags(o);
 if(!f.active)return{level:'Closed',reason:'Order is '+(['Completed','Cancelled'].includes(o.status)?o.status.toLowerCase():'delivered')+'; no active alerts.',action:'No action needed.',key:'closed'};
 const c=S.config,t=today(),H=[],Md=[],un=!shipped(o)&&o.shipDate,sd=un?diff(o.shipDate,t):null,
 apr=o.approval==='Pending',ps=['Requested','In Preparation','Revision Requested'].includes(o.sample)||o.approval==='Changes Requested',dep=apr||ps,
 ad=o.approvalDeadline?diff(o.approvalDeadline,t):null,what=apr?'Client approval':'Revised sample',blocked=['Awaiting Approval','Awaiting Sample Approval'].includes(o.production),
 gap=o.quality!=='Cleared'?'quality clearance is "'+o.quality+'"':!['Approved','Not Required'].includes(o.approval)?'client approval is "'+o.approval+'"':'',fu=o.nextFollowUp?diff(o.nextFollowUp,t):null;
 if(un&&sd<0)H.push({m:'Shipment deadline '+show(o.shipDate)+' passed '+(-sd)+' day(s) ago and the order is not shipped.',a:'Confirm shipment status with Logistics and update the client.'});
 if(dep&&ad!==null&&ad<0)H.push({m:what+' is overdue by '+(-ad)+' day(s)'+(blocked?' and production cannot proceed.':'.'),a:apr?'Contact the client today for an approval decision.':'Chase the sampling team and the client for the revised sample.'});
 if(un&&sd>=0&&sd<=c.highShipDays&&gap)H.push({m:'Shipment is due in '+sd+' day(s) but '+gap+'.',a:'Confirm clearance with the responsible team before the deadline.'});
 if(un&&o.pendingTask&&sd>=0&&sd<=c.highShipDays)H.push({m:'Pending task "'+o.pendingTask+'" is still open with the deadline in '+sd+' day(s).',a:'Confirm completion of "'+o.pendingTask+'" today.'});
 if(o.priority==='High'&&fu!==null&&fu<0)H.push({m:'High-priority follow-up was due '+(-fu)+' day(s) ago.',a:'Complete the follow-up and record the outcome.'});
 if(fu!==null&&fu<0&&o.priority!=='High')Md.push({m:'Follow-up is overdue by '+(-fu)+' day(s).',a:'Complete the follow-up and record the outcome.'});
 if(fu!==null&&fu>=0&&fu<=c.followWarnDays)Md.push({m:'Follow-up is due '+(fu===0?'today':'in '+fu+' day(s)')+'.',a:'Prepare and complete the follow-up.'});
 if(dep&&(ad===null||(ad>=0&&ad<=c.pendingDays)))Md.push({m:what+' is pending'+(ad===null?' (no deadline set).':' with '+ad+' day(s) left.'),a:apr?'Send a polite reminder to the client before the deadline.':'Coordinate the revision with the sampling team.'});
 if(un&&sd>=0&&sd<=c.medShipDays&&gap)Md.push({m:'Shipment is due in '+sd+' day(s) and '+gap+'.',a:'Confirm clearance with the responsible team.'});
 if(un&&o.pendingTask&&sd>=0&&sd<=c.medShipDays)Md.push({m:'Pending task "'+o.pendingTask+'" must finish before the deadline in '+sd+' day(s).',a:'Check progress on "'+o.pendingTask+'".'});
 if(o.status==='On Hold'||o.shipment==='On Hold')Md.push({m:'On hold: '+(o.holdReason||'no reason recorded')+'.',a:'Find out whether the hold can be lifted.'});
 const L1=H.length?H:Md.length?Md:null,level=H.length?'High':Md.length?'Medium':'Low';
 if(L1)return{level,reason:level+' risk: '+L1.slice(0,2).map(x=>x.m).join(' '),action:L1[0].a,key:level+L1[0].m};
 return{level:'Low',reason:'Low risk: progressing normally'+(dep&&ad!==null?'; '+what.toLowerCase()+' pending but '+ad+' day(s) remain.':un?'; next deadline '+dayTxt(o.shipDate)+'.':'.'),action:'Continue as planned.',key:'Low'}}

/* ===== 2. INITIAL DEMONSTRATION DATA ===== */
function seed(){
 const t=today(),d=n=>addDays(t,n),at=(n,h)=>new Date(parse(d(n)).getTime()+(h||12)*36e5).toISOString();
 const O=[],A=[],T=[];
 const add=o=>{const x=Object.assign({},BLANK,o);O.push(x);A.push({id:uid('a'),orderId:x.id,at:at(parse(x.created)>0?diff(x.created,t):0),type:'Order created',text:'Demonstration order created.'})};

 add({id:'DEMO-001',client:'Crescent Home Textiles',product:'Printed cotton fabric',qty:4500,created:d(-21),shipDate:d(25),status:'In Progress',sample:'Sent to Client',approval:'Pending',production:'Awaiting Approval',quality:'Not Started',shipment:'Not Scheduled',owner:L.dept[0],priority:'High',sampleReq:d(-18),sampleDesc:'Printed cotton colourway strike-off',sentDate:d(-12),approvalDeadline:d(-5),pendingTask:'Client sample approval',nextAction:'Follow up with client for sample approval.',nextFollowUp:t,notes:'Client has not yet responded to the sample submission.'});
 act('DEMO-001',-12,'Sample submitted','Printed cotton sample sent to the client for approval.');act('DEMO-001',-1,'Note','The client has not yet responded to the sample submission.');
 add({id:'DEMO-002',client:'Meadow Living',product:'Embroidered cushion fabric',qty:1800,created:d(-20),shipDate:d(35),status:'In Progress',sample:'Revision Requested',approval:'Changes Requested',production:'Awaiting Sample Approval',quality:'Not Started',shipment:'Not Scheduled',owner:L.dept[1],priority:'Medium',sampleReq:d(-16),sampleDesc:'Embroidered cushion sample, first version',sentDate:d(-9),approvalDeadline:d(4),feedback:'Client comment (fictional): overall look is fine, but a design detail on the border needs revision.',requestedChanges:'Reduce the border motif size slightly and re-check thread colour against the reference.',pendingTask:'Revised embroidery border sample',nextAction:'Coordinate the requested sample changes with the sampling team.',nextFollowUp:d(2),notes:'Waiting for revised sample.'});

 add({id:'DEMO-003',client:'Urban Nest Interiors',product:'Woven upholstery fabric',qty:3200,created:d(-40),shipDate:d(4),status:'In Progress',sample:'Approved',approval:'Approved',production:'In Progress',quality:'Pending Clearance',shipment:'Scheduled',owner:L.dept[4],priority:'High',sampleReq:d(-35),sampleDesc:'Woven upholstery sample',sentDate:d(-30),approvalDate:d(-25),pendingTask:'Production completion and quality clearance',nextAction:'Confirm production completion and quality clearance with the responsible teams.',nextFollowUp:d(1),notes:'Quality clearance is outstanding and the shipment schedule needs to be checked.'});

 add({id:'DEMO-007',client:'Northfield Hospitality Supply',product:'Poly-cotton bed sheeting',qty:6000,created:d(-35),shipDate:d(9),status:'In Progress',sample:'Approved',approval:'Approved',production:'Completed',quality:'Pending Clearance',shipment:'Awaiting Clearance',owner:L.dept[4],priority:'Medium',approvalDate:d(-22),pendingTask:'Quality inspection',nextAction:'Ask Quality for inspection date.',nextFollowUp:d(1),notes:'Awaiting quality inspection.'});
